name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday: catch a new library release that breaks the code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests + pipeline smoke run (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests (deprecation warnings count as errors)
        run: python -m pytest -q -W error::DeprecationWarning
      - name: Full pipeline on fake data (the real CSV is not in the repo)
        run: |
          python src/sample_data.py
          python src/data_prep.py
          python src/backtest.py --hotel "City Hotel"
          python src/price_backtest.py --hotel "City Hotel"

  demo:
    name: Streamlit demo starts with the pinned versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - run: pip install -r requirements-app.txt pytest
      - run: python -m pytest -q tests/test_app.py

  security:
    name: Known vulnerabilities in the demo's dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements-app.txt
